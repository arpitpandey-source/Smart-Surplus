{% extends "base.html" %}
{% block title %}Error {{ err.code }}{% endblock %}
{% block content %}
<section class="donation-card error-card">
    <p class="eyebrow">REQUEST ERROR</p>
    <h1>{{ err.code }} - {{ err.name }}</h1>
    <p>{{ err.description }}</p>
    <div class="action-row">
        <a href="{{ url_for('home') }}" class="primary-button">Go to Home</a>
        <a href="{{ url_for('donations') }}" class="secondary-button">Browse Donations</a>
        {% if not g.user %}
        <a href="{{ url_for('login') }}" class="secondary-button">Log in</a>
        {% endif %}
    </div>
</section>
{% endblock %}
