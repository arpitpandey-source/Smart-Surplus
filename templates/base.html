<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartSurplus{% endblock %} | SmartSurplus</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include "_nav.html" %}
    <main class="form-page">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="notice {{ 'success-notice' if category == 'success' else 'error-notice' }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% if error %}<div class="notice error-notice">{{ error }}</div>{% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer><p>© 2026 SmartSurplus</p></footer>
</body>
</html>
