{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="form-heading"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1></section>
<form class="donation-form" method="POST" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required maxlength="255" autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
    <button type="submit" class="primary-button form-submit">Log in</button>
</form>
<p class="small-note">No account? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
