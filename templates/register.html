{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="form-heading"><p class="eyebrow">JOIN SMARTSURPLUS</p><h1>Create an account</h1></section>
<form class="donation-form" method="POST" action="{{ url_for('register') }}" data-submit-label="Creating account...">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name / organisation</label>
    <input type="text" id="full_name" name="full_name" required maxlength="100" autocomplete="name" value="{{ form.get('full_name', '') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required maxlength="255" autocomplete="email" value="{{ form.get('email', '') }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password" aria-describedby="password-hint">
    <p id="password-hint" class="field-hint">At least 8 characters with uppercase, lowercase, a number, and a special character.</p>
    <label for="role">I want to</label>
    <select id="role" name="role" required>
        <option value="">Choose...</option>
        <option value="donor" {{ 'selected' if form.get('role') == 'donor' }}>Donate surplus food</option>
        <option value="recipient" {{ 'selected' if form.get('role') == 'recipient' }}>Receive food</option>
    </select>
    <button type="submit" class="primary-button form-submit">Create account</button>
</form>
<p class="small-note">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
