{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="form-heading"><p class="eyebrow">JOIN SMARTSURPLUS</p><h1>Create an account</h1></section>
<form class="donation-form" method="POST" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="full_name">Full name / organisation</label>
    <input type="text" id="full_name" name="full_name" required maxlength="100" value="{{ form.get('full_name', '') }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required maxlength="255" value="{{ form.get('email', '') }}">
    <label for="password">Password (min 8 characters)</label>
    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    <label for="role">I want to</label>
    <select id="role" name="role" required>
        <option value="">Choose...</option>
        <option value="donor" {{ 'selected' if form.get('role') == 'donor' }}>Donate surplus food</option>
        <option value="recipient" {{ 'selected' if form.get('role') == 'recipient' }}>Receive food</option>
    </select>
    <button type="submit" class="primary-button form-submit">Create account</button>
</form>
{% endblock %}
